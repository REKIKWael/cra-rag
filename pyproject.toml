[project]
name = "cra-rag"
version = "0.1.0"
description = "Cited question-answering over EU product cybersecurity regulation (Cyber Resilience Act, RED delegated act)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "qdrant-client>=1.20.0",
    "snowballstemmer>=3.1.1",
    "uvicorn>=0.30",
]

[project.scripts]
cra-rag = "cra_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette now suggests httpx2 for its test client; httpx still works fine.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
