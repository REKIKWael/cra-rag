name: Evaluate

# End-to-end evaluation with the real models, on GitHub's free runners (CPU only).
# It takes from a few minutes to about an hour, too long for every push, so it is
# run by hand: Actions tab > Evaluate > Run workflow.
#
# 1. Search: builds the vector index, scores BM25, semantic and hybrid search on
#    the reference questions, and fails if one falls below recall@10 = 0.80.
# 2. Answers: reuses the answers committed in eval/results/ when the settings are
#    unchanged (model, prompt, search method); only changed ones are recomputed.
# 3. Judge: a larger model compares every answer with the reference answer.
#
# The scores appear on the run page; the files are kept as the "eval-results" artifact.
#
# Mode "rag": one search, then the answer. Mode "agent": the model searches the texts
# itself with tools (agent.py), so it calls the model several times per question.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which answers to compute and judge
        type: choice
        options: [rag, agent]
        default: rag

permissions:
  contents: read

env:
  OLLAMA_VERSION: "0.40.13" # same version as compose.yaml
  MODE: ${{ inputs.mode }}

defaults:
  run:
    shell: bash

jobs:
  evaluate:
    name: Search, answers and judge
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (from the lock file)
        run: uv sync --locked

      - name: Free disk space for the models
        # About 12 GB of models; the runner comes with toolchains this job does not use.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install and start Ollama
        # The release archive is downloaded, then checked against its SHA-256 before
        # anything runs: no "curl | sh". The checksum comes from the release's
        # sha256sum.txt; a change of version means a new checksum here.
        # Run 1 lost the runner while the judge model was working: a model running on
        # every CPU can starve the runner's own process. So Ollama runs with the lowest
        # CPU priority (nice), with at most two models in memory: the embedding model,
        # which every search needs, and one chat model.
        env:
          OLLAMA_SHA256: c9490e0f520be21271d969e6703f012268b1d39f8b70dd58854e5bfef7a75bb6
        run: |
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar --zstd --extract --file "$archive" --directory /usr/local
          rm "$archive"
          OLLAMA_MAX_LOADED_MODELS=2 OLLAMA_NUM_PARALLEL=1 \
            nohup nice -n 19 ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 2
          done
          ollama --version
          free -m

      - name: Download the models
        run: |
          ollama pull bge-m3          # embeddings (search)
          ollama pull ministral-3:3b  # answers
          ollama pull ministral-3:8b  # judge

      - name: Restore the embeddings of earlier runs
        id: embeddings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/index/bge-m3.cache.jsonl
          key: embeddings-bge-m3-${{ hashFiles('corpus/raw/**', 'src/cra_rag/parse.py', 'src/cra_rag/chunks.py') }}
          restore-keys: embeddings-bge-m3-

      - name: Build the vector index
        run: uv run cra-rag index

      - name: Save the embeddings for the next runs
        # Saved now rather than at the end of the job, so a later failure keeps them.
        if: steps.embeddings.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/index/bge-m3.cache.jsonl
          key: ${{ steps.embeddings.outputs.cache-primary-key }}

      - name: Score the search
        run: |
          status=0
          uv run cra-rag eval-search --method all --fail-under 0.80 > search-scores.txt || status=$?
          cat search-scores.txt
          {
            echo "## Search (36 questions with an answer in the corpus)"
            echo '```'
            cat search-scores.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Answer the 40 questions (reuses the committed answers)
        timeout-minutes: 180
        run: uv run cra-rag eval-answers --mode "$MODE"

      - name: Judge the answers
        timeout-minutes: 120
        run: |
          # One line a minute on memory and load, to see what happens if the runner suffers.
          (while sleep 60; do
            echo "[monitor] memory $(free -m | awk '/Mem:/ {print $3 "/" $2}') MB, load $(cut -d' ' -f1 /proc/loadavg)"
          done) &
          trap 'kill $!' EXIT
          uv run cra-rag judge --mode "$MODE"

      - name: Write the scores on the run page
        run: |
          report=eval/results/answers-ministral-3_3b.md
          if [ "$MODE" = agent ]; then report=eval/results/answers-agent-ministral-3_3b.md; fi
          {
            echo "## Answers of ministral-3:3b ($MODE mode), judged by ministral-3:8b"
            echo
            sed -n '/^Verdicts of/,/^Median/p' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval/results/

      - name: Ollama logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log"
