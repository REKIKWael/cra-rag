# Reference questions used to measure cra-rag.
# Written by a practitioner of product cybersecurity regulation. Each question
# names the sections that answer it, so retrieval and answers can be scored.
#
# Fields
#   id        unique: "q001", "q002"...
#   lang      "fr" or "en", the language of the question
#   type      "lookup"        answered by one section
#             "multi"         needs several sections together
#             "trap"          a common misconception, or a point the corpus gets wrong
#             "out_of_scope"  the texts do not answer it: the assistant must say so
#   question  asked the way a manufacturer would ask it, not copied from the text
#   expected  ids of the sections holding the answer (find them with `uv run cra-rag show`);
#             empty for "out_of_scope"
#   answer    the key facts a correct answer must contain
#   tags      free labels used to break the scores down (optional)
#   notes     anything useful for a reviewer (optional)
#
# Check the file with: uv run cra-rag questions

[[questions]]
id = "q001"
lang = "fr"
type = "lookup"
question = "On vient de découvrir qu'une faille de notre produit est exploitée par des attaquants. Qui doit-on prévenir, et dans quels délais ?"
expected = ["cra:art_14"]
answer = """Notifier simultanément le CSIRT désigné comme coordinateur et l'ENISA, via la plateforme
unique de signalement : alerte précoce au plus tard 24 heures après en avoir eu connaissance,
notification de la vulnérabilité au plus tard 72 heures après, rapport final au plus tard 14 jours
après la mise à disposition d'une mesure de correction ou d'atténuation."""
tags = ["signalement", "délais"]

[[questions]]
id = "q002"
lang = "fr"
type = "trap"
question = "Le CRA ne s'applique qu'en décembre 2027 : est-ce qu'on a vraiment besoin d'organiser le signalement des vulnérabilités dès maintenant ?"
expected = ["cra:art_71"]
answer = """Oui. Le règlement s'applique à partir du 11 décembre 2027, mais l'article 14
(obligations de signalement) s'applique dès le 11 septembre 2026."""
tags = ["dates d'application", "signalement"]
notes = "Idée reçue fréquente : tout s'appliquerait en 2027."

[[questions]]
id = "q003"
lang = "fr"
type = "multi"
question = "Nous éditons un gestionnaire de mots de passe. Peut-on se contenter d'une auto-évaluation pour la conformité ?"
expected = ["cra:anx_III", "cra:art_7", "cra:art_32"]
answer = """Les gestionnaires de mots de passe sont des produits importants de classe I (annexe III,
article 7). Le contrôle interne (module A) n'est possible que si le fabricant applique entièrement des
normes harmonisées, des spécifications communes ou un schéma européen de certification (niveau
« substantiel » au minimum) ; sinon il faut passer par le module B suivi du module C, ou par le
module H (article 32, paragraphe 2)."""
tags = ["classification", "évaluation de la conformité"]

[[questions]]
id = "q004"
lang = "fr"
type = "lookup"
question = "Pendant combien de temps doit-on fournir des correctifs de sécurité pour un produit ?"
expected = ["cra:art_13"]
answer = """La période d'assistance est d'au moins cinq ans, sauf si le produit est censé être utilisé
moins longtemps : elle correspond alors à sa durée d'utilisation prévue. Chaque mise à jour de
sécurité publiée reste disponible au moins dix ans, ou pendant le reste de la période d'assistance
si elle est plus longue."""
tags = ["période d'assistance", "mises à jour"]

[[questions]]
id = "q005"
lang = "en"
type = "lookup"
question = "What is the maximum fine if our product does not meet the essential cybersecurity requirements?"
expected = ["cra:art_64"]
answer = """Up to EUR 15 000 000 or, for an undertaking, up to 2.5 % of its total worldwide annual
turnover for the preceding financial year, whichever is higher. The same ceiling applies to breaches
of the obligations in Articles 13 and 14."""
tags = ["penalties"]

[[questions]]
id = "q006"
lang = "en"
type = "lookup"
question = "When does a vulnerability count as 'actively exploited' under the CRA?"
expected = ["cra:art_3"]
answer = """When there is reliable evidence that a malicious actor has exploited it in a system
without the permission of the system owner (Article 3, point 42)."""
tags = ["definitions", "reporting"]

[[questions]]
id = "q007"
lang = "fr"
type = "trap"
question = "Depuis quand les exigences de cybersécurité du règlement délégué RED sont-elles obligatoires pour les équipements radio ?"
expected = ["red-da:art_3"]
answer = """Depuis le 1er août 2025. Le texte d'origine indiquait le 1er août 2024, mais la date a été
reportée par le règlement délégué (UE) 2023/2444."""
tags = ["RED", "dates d'application"]
notes = "Le corpus ne contient pas encore 2023/2444 : un assistant qui répond 2024 se trompe."

[[questions]]
id = "q008"
lang = "fr"
type = "out_of_scope"
question = "Quelles exigences de la norme EN 18031-1 portent sur l'authentification ?"
expected = []
answer = """Les textes du corpus ne contiennent pas la norme EN 18031-1. L'assistant doit le dire et
ne pas inventer le contenu de la norme."""
tags = ["RED", "normes"]
[[questions]]
id = "q009"
lang = "fr"
type = "lookup"
question = "Peut-on livrer notre produit avec les protections désactivées, et laisser le client les activer s'il le souhaite ?"
expected = ["cra:anx_I"]
answer = """Non : le produit doit être mis sur le marché avec une configuration de sécurité par défaut
(annexe I, partie I, point 2 b)), avec la possibilité de le réinitialiser à son état d'origine.
Seule exception : un accord contraire avec une entreprise utilisatrice pour un produit sur mesure."""
tags = ["exigences essentielles", "sécurité par défaut"]
[[questions]]
id = "q010"
lang = "fr"
type = "lookup"
question = "Qu'est-ce qu'on doit obligatoirement mettre dans la notice de notre produit côté cybersécurité ?"
expected = ["cra:anx_II"]
answer = """Au minimum : les coordonnées du fabricant ; le point de contact unique pour signaler les
vulnérabilités et la politique de divulgation coordonnée ; l'identification du produit ; son
utilisation prévue et ses propriétés de sécurité ; les risques de cybersécurité prévisibles ;
l'adresse de la déclaration UE de conformité ; le type d'assistance et la date de fin de la période
d'assistance ; des instructions pour la mise en service sécurisée, l'installation des mises à jour,
la mise hors service avec suppression des données et la désactivation des mises à jour automatiques."""
tags = ["information de l'utilisateur", "notice"]

[[questions]]
id = "q011"
lang = "en"
type = "lookup"
question = "A market surveillance authority thinks our product is a serious cybersecurity risk. What can it actually do to us?"
expected = ["cra:art_54"]
answer = """It evaluates the product against all the requirements of the Regulation. If the product
does not comply, it requires us to take corrective action, withdraw the product or recall it, within a
reasonable period proportionate to the risk. If we do not act in time, it adopts provisional measures
to prohibit or restrict the product on its national market, or to withdraw or recall it, and notifies
the Commission and the other Member States."""
tags = ["market surveillance"]

[[questions]]
id = "q012"
lang = "fr"
type = "lookup"
question = "Un laboratoire d'essais veut devenir organisme notifié pour le CRA. Quelles conditions doit-il remplir ?"
expected = ["cra:art_39"]
answer = """Être constitué en droit national avec la personnalité juridique ; être un tiers indépendant
des produits qu'il évalue (ni concepteur, ni fabricant, ni distributeur, ni consultant pour ces
produits) ; garantir son impartialité, la rémunération du personnel ne dépendant ni du nombre ni du
résultat des évaluations ; disposer d'un personnel compétent (formation technique, connaissance de
l'annexe I, des normes harmonisées et des spécifications communes) et de procédures documentées pour
exécuter les tâches de l'annexe VIII ; souscrire une assurance responsabilité civile ; respecter le
secret professionnel ; participer à la normalisation et au groupe de coordination des organismes
notifiés."""
tags = ["organismes notifiés"]

[[questions]]
id = "q013"
lang = "fr"
type = "multi"
question = "Notre produit n'est pas dans la liste des produits importants aujourd'hui. La Commission peut-elle l'y ajouter plus tard, et jusqu'à quand ?"
expected = ["cra:art_7", "cra:art_61"]
answer = """Oui. La Commission peut modifier l'annexe III par actes délégués : ajouter une catégorie dans
chaque classe, déplacer une catégorie d'une classe à l'autre ou en retirer une (article 7,
paragraphe 3). Ce pouvoir lui est conféré pour cinq ans à compter du 10 décembre 2024, puis prorogé
tacitement pour des périodes identiques, sauf opposition du Parlement européen ou du Conseil au plus
tard trois mois avant la fin de chaque période (article 61, paragraphe 2)."""
tags = ["classification", "actes délégués"]

[[questions]]
id = "q014"
lang = "fr"
type = "multi"
question = "Nous fabriquons des cartes à puce sécurisées. Sont-elles des produits critiques, et qu'est-ce que ça change pour la conformité ?"
expected = ["cra:anx_IV", "cra:art_8", "cra:art_32"]
answer = """Oui : les cartes à puce et dispositifs similaires, y compris les éléments sécurisés, figurent à
l'annexe IV. La Commission peut exiger par acte délégué un certificat européen de cybersécurité au
niveau d'assurance « substantiel » au minimum (article 8, paragraphe 1). Tant qu'aucun acte délégué
n'est adopté, ils suivent les procédures de l'article 32, paragraphe 3 : module B suivi du module C,
module H, ou un schéma européen de certification. L'auto-évaluation (module A) n'est pas possible."""
tags = ["classification", "produits critiques", "évaluation de la conformité"]

[[questions]]
id = "q015"
lang = "fr"
type = "lookup"
question = "On doit rédiger notre déclaration UE de conformité. Quelles informations doit-elle contenir ?"
expected = ["cra:anx_V"]
answer = """L'identification unique du produit (nom, type) ; le nom et l'adresse du fabricant ou de son
mandataire ; la mention qu'elle est établie sous la seule responsabilité du fabricant ; l'objet de la
déclaration, permettant la traçabilité ; la conformité à la législation d'harmonisation de l'Union ;
les normes harmonisées, spécifications communes ou certifications appliquées ; le cas échéant, le nom
et le numéro de l'organisme notifié, la procédure suivie et la référence du certificat ; la date, le
lieu, le nom, la fonction et la signature du signataire."""
tags = ["déclaration de conformité"]

[[questions]]
id = "q016"
lang = "fr"
type = "multi"
question = "Peut-on mettre une version courte de la déclaration de conformité dans le carton plutôt que le document complet ?"
expected = ["cra:art_13", "cra:anx_VI"]
answer = """Oui. Le fabricant fournit avec le produit soit une copie de la déclaration UE de conformité,
soit une déclaration simplifiée (article 13, paragraphe 20). La version simplifiée suit le modèle de
l'annexe VI : le fabricant déclare que le produit de type … est conforme au règlement (UE) 2024/2847,
et elle doit indiquer l'adresse internet exacte où le texte complet est disponible."""
tags = ["déclaration de conformité"]

[[questions]]
id = "q017"
lang = "en"
type = "lookup"
question = "What do we need to put in our technical documentation file?"
expected = ["cra:anx_VII"]
answer = """At least: a general description of the product (intended purpose, software versions, photos
of hardware, user instructions); a description of design, development, production and vulnerability
handling, including the software bill of materials, the coordinated vulnerability disclosure policy
and how updates are distributed securely; the cybersecurity risk assessment; the information used to
set the support period; the harmonised standards, common specifications or certification schemes
applied, or the solutions adopted instead; test reports; a copy of the EU declaration of conformity;
and the software bill of materials on reasoned request of a market surveillance authority."""
tags = ["technical documentation"]

[[questions]]
id = "q018"
lang = "fr"
type = "lookup"
question = "Quelle est la différence entre le module A et le module H pour évaluer la conformité ?"
expected = ["cra:anx_VIII"]
answer = """Module A (contrôle interne) : le fabricant établit la documentation technique et déclare sous
sa seule responsabilité que le produit respecte les exigences essentielles, sans organisme notifié.
Module H (assurance complète de la qualité) : le fabricant applique un système de qualité, couvrant
la conception, le développement, les essais et la gestion des vulnérabilités, approuvé par un
organisme notifié de son choix, qui le surveille ensuite pendant toute la période d'assistance."""
tags = ["évaluation de la conformité", "modules"]

[[questions]]
id = "q019"
lang = "fr"
type = "lookup"
question = "Nous fabriquons un dispositif médical connecté. Est-ce qu'il est concerné par le CRA ?"
expected = ["cra:art_2"]
answer = """Non : le CRA ne s'applique pas aux produits relevant du règlement (UE) 2017/745 (dispositifs
médicaux) ni du règlement (UE) 2017/746 (dispositifs médicaux de diagnostic in vitro), comme le prévoit
l'article 2, paragraphe 2. Ces produits restent soumis à leur propre réglementation."""
tags = ["champ d'application"]

[[questions]]
id = "q020"
lang = "en"
type = "lookup"
question = "We import connected cameras made outside the EU. What do we have to check before we start selling them?"
expected = ["cra:art_19"]
answer = """Importers may only place on the market products that meet the essential requirements of
Annex I. Before placing a product on the market they must ensure that the manufacturer carried out the
appropriate conformity assessment (Article 32), that the technical documentation has been drawn up,
that the product bears the CE marking and comes with the EU declaration of conformity and the user
information of Annex II in an easily understood language, and that the manufacturer complied with
Article 13(15), (16) and (19)."""
tags = ["importers", "economic operators"]

[[questions]]
id = "q021"
lang = "fr"
type = "lookup"
question = "On achète des routeurs à un fabricant asiatique et on les vend sous notre propre marque. Quelles obligations avons-nous ?"
expected = ["cra:art_21"]
answer = """Vous êtes considérés comme fabricant. Un importateur ou un distributeur qui met un produit sur
le marché sous son propre nom ou sa propre marque est soumis aux articles 13 et 14 (obligations
des fabricants et signalement). Il en va de même s'il apporte une modification substantielle à un
produit déjà mis sur le marché (article 21)."""
tags = ["opérateurs économiques", "fabricant"]

[[questions]]
id = "q022"
lang = "fr"
type = "lookup"
question = "Notre objet connecté dépend d'un serveur cloud que nous développons nous-mêmes. Ce backend est-il couvert par le CRA ?"
expected = ["cra:art_3"]
answer = """Oui, en tant que solution de traitement de données à distance : le « produit comportant des
éléments numériques » inclut ses solutions de traitement de données à distance (article 3, point 1).
Il s'agit de tout traitement à distance conçu et développé par le fabricant ou sous sa responsabilité,
et dont l'absence empêcherait le produit d'exécuter une de ses fonctions (article 3, point 2)."""
tags = ["champ d'application", "définitions", "cloud"]

[[questions]]
id = "q023"
lang = "fr"
type = "lookup"
question = "Peut-on faire payer les mises à jour de sécurité à nos clients, par exemple dans un contrat de maintenance ?"
expected = ["cra:anx_I"]
answer = """Non : les correctifs et mises à jour de sécurité doivent être diffusés sans retard et
gratuitement, accompagnés de messages consultatifs qui indiquent aux utilisateurs les mesures à
prendre (annexe I, partie II, point 8). Seule exception : un accord contraire avec un utilisateur
professionnel pour un produit sur mesure."""
tags = ["mises à jour", "gestion des vulnérabilités"]

[[questions]]
id = "q024"
lang = "en"
type = "lookup"
question = "Can we wait and ship our security fixes together with the next feature release?"
expected = ["cra:anx_I"]
answer = """Not as a rule. Vulnerabilities must be addressed and remediated without delay, including by
providing security updates, and where technically feasible new security updates must be provided
separately from functionality updates (Annex I, Part II, point 2)."""
tags = ["security updates", "vulnerability handling"]

[[questions]]
id = "q025"
lang = "fr"
type = "lookup"
question = "On a trouvé une faille dans une bibliothèque open source que notre produit intègre. Qu'est-ce qu'on doit faire ?"
expected = ["cra:art_13"]
answer = """Signaler la vulnérabilité à la personne ou à l'entité qui maintient le composant, la traiter
et y remédier selon les exigences de l'annexe I, partie II, et, si vous avez développé un correctif,
partager le code ou la documentation correspondants avec le mainteneur, dans un format lisible par
machine s'il y a lieu (article 13, paragraphe 6)."""
tags = ["composants tiers", "open source", "gestion des vulnérabilités"]

[[questions]]
id = "q026"
lang = "fr"
type = "lookup"
question = "Est-ce qu'on doit dire à l'acheteur jusqu'à quand le produit recevra des mises à jour de sécurité ?"
expected = ["cra:art_13"]
answer = """Oui : la date de fin de la période d'assistance, avec au moins le mois et l'année, doit être
précisée au moment de l'achat, de manière claire, compréhensible et facilement accessible, et le cas
échéant sur le produit, son emballage ou par des moyens numériques (article 13, paragraphe 19)."""
tags = ["période d'assistance", "information de l'utilisateur"]

[[questions]]
id = "q027"
lang = "en"
type = "lookup"
question = "What fine do we risk if we give incomplete or misleading information to a market surveillance authority?"
expected = ["cra:art_64"]
answer = """Up to EUR 5 000 000 or, for an undertaking, up to 1 % of its total worldwide annual turnover
for the preceding financial year, whichever is higher (Article 64(4)). It covers incorrect, incomplete
or misleading information supplied to notified bodies and market surveillance authorities in reply to
a request."""
tags = ["penalties"]

[[questions]]
id = "q028"
lang = "fr"
type = "lookup"
question = "Peut-on montrer un prototype pas encore conforme sur un salon, ou diffuser une version bêta de notre logiciel ?"
expected = ["cra:art_4"]
answer = """Oui, sous conditions. Lors d'un salon, d'une exposition ou d'une démonstration, un produit non
conforme, y compris un prototype, peut être présenté s'il porte une marque visible indiquant qu'il
n'est pas conforme et ne sera pas mis à disposition tant qu'il ne l'est pas. Un logiciel inachevé non
conforme peut être mis à disposition pour une durée limitée nécessaire aux essais, avec une marque
visible indiquant qu'il n'est pas conforme et ne sert qu'aux essais (article 4, paragraphes 2 et 3)."""
tags = ["champ d'application", "prototypes"]

[[questions]]
id = "q029"
lang = "fr"
type = "lookup"
question = "Nos équipements sont développés uniquement pour les forces armées. Le CRA s'applique-t-il ?"
expected = ["cra:art_2"]
answer = """Non : le règlement ne s'applique pas aux produits développés ou modifiés exclusivement à des
fins de sécurité nationale ou de défense, ni aux produits spécifiquement conçus pour traiter des
informations classifiées (article 2, paragraphe 7)."""
tags = ["champ d'application", "défense"]

[[questions]]
id = "q030"
lang = "en"
type = "lookup"
question = "Our product is pure software, there is nothing physical to stick a label on. Where does the CE marking go?"
expected = ["cra:art_30"]
answer = """For software, the CE marking is affixed either to the EU declaration of conformity or on the
website accompanying the software; in the latter case the relevant section of the website must be
easily and directly accessible to consumers (Article 30(1)). It must be affixed before the product is
placed on the market (Article 30(3)), followed by the notified body's identification number when
module H is used (Article 30(4))."""
tags = ["CE marking", "software"]

[[questions]]
id = "q031"
lang = "fr"
type = "lookup"
question = "Une faille qui n'est pas exploitée, ou un incident évité de justesse : peut-on quand même les signaler ?"
expected = ["cra:art_15"]
answer = """Oui, de manière volontaire. Les fabricants, comme toute autre personne physique ou morale,
peuvent notifier à un CSIRT désigné comme coordinateur ou à l'ENISA toute vulnérabilité, les
cybermenaces susceptibles d'affecter le profil de risque d'un produit, tout incident ayant des
répercussions sur sa sécurité, ainsi que les incidents évités qui auraient pu en provoquer un
(article 15, paragraphes 1 et 2)."""
tags = ["signalement", "signalement volontaire"]

[[questions]]
id = "q032"
lang = "fr"
type = "multi"
question = "Un intégrateur modifie le firmware d'une caméra déjà vendue pour l'utiliser autrement, puis la revend. Devient-il fabricant ?"
expected = ["cra:art_3", "cra:art_22"]
answer = """Oui, si c'est une modification substantielle : une modification apportée après la mise sur le
marché qui a une incidence sur la conformité aux exigences essentielles de l'annexe I, partie I, ou
qui modifie l'utilisation prévue pour laquelle le produit a été évalué (article 3, point 30). La
personne qui apporte une telle modification et met le produit à disposition est considérée comme
fabricant (article 22) : elle est soumise aux articles 13 et 14 pour la partie modifiée, ou pour tout
le produit si la modification affecte sa cybersécurité dans son ensemble."""
tags = ["modification substantielle", "opérateurs économiques"]

[[questions]]
id = "q033"
lang = "en"
type = "multi"
question = "A non-profit foundation maintains an open-source library that companies use in their products. Does the CRA put obligations on the foundation?"
expected = ["cra:art_3", "cra:art_24", "cra:art_64"]
answer = """If it qualifies as an open-source software steward, that is a legal person other than a
manufacturer that systematically supports on a sustained basis the development of specific free and
open-source products intended for commercial activities (Article 3(14)), it must put in place and
document a cybersecurity policy, cooperate with market surveillance authorities and give them its
documentation on reasoned request, and report actively exploited vulnerabilities under Article 14(1)
to the extent it is involved in development (Article 24). Administrative fines do not apply to
open-source software stewards (Article 64(10))."""
tags = ["open source", "stewards"]

[[questions]]
id = "q034"
lang = "fr"
type = "multi"
question = "Nous sommes une petite entreprise de 20 personnes. Le CRA prévoit-il des allègements pour nous ?"
expected = ["cra:art_33", "cra:art_32", "cra:art_64"]
answer = """Oui. Les États membres mènent des actions de sensibilisation et de formation, ouvrent un canal
de communication dédié, soutiennent les essais et l'évaluation de la conformité, et peuvent créer des
sas réglementaires ; les micro et petites entreprises peuvent fournir la documentation technique dans
un format simplifié (article 33). Les redevances d'évaluation de la conformité tiennent compte des
besoins des PME et sont réduites en proportion (article 32, paragraphe 6). Les micro et petites
entreprises ne reçoivent pas d'amende pour un dépassement du délai de 24 heures de l'alerte précoce
(article 64, paragraphe 10)."""
tags = ["PME", "sanctions"]

[[questions]]
id = "q035"
lang = "en"
type = "multi"
question = "We make firewalls. How are they classified, and can we assess conformity ourselves?"
expected = ["cra:anx_III", "cra:art_32"]
answer = """Firewalls and intrusion detection and prevention systems are important products of class II
(Annex III). Class II products cannot use internal control (module A): they need EU-type examination
(module B) followed by module C, full quality assurance (module H), or, where available and
applicable, a European cybersecurity certification scheme at assurance level at least 'substantial'
(Article 32(3))."""
tags = ["classification", "conformity assessment"]

[[questions]]
id = "q036"
lang = "fr"
type = "trap"
question = "Les produits qu'on a vendus avant décembre 2027 échappent complètement au CRA, non ?"
expected = ["cra:art_69", "cra:art_71"]
answer = """Non. Les produits mis sur le marché avant le 11 décembre 2027 ne sont soumis aux exigences du
règlement que s'ils font l'objet d'une modification substantielle à partir de cette date (article 69,
paragraphe 2). Mais les obligations de signalement de l'article 14 s'appliquent aussi à ces produits
(article 69, paragraphe 3), et ce dès le 11 septembre 2026 (article 71)."""
tags = ["dates d'application", "signalement", "produits existants"]
notes = """Idée reçue fréquente. Attention aussi : dans le texte publié, la version française de
l'article 69, paragraphe 3, dit « mis sur le marché le 11 décembre 2027 », alors que la version
anglaise dit « before 11 December 2027 ». Divergence à signaler."""

[[questions]]
id = "q037"
lang = "fr"
type = "trap"
question = "Le CRA nous oblige-t-il à publier la SBOM de nos produits ?"
expected = ["cra:anx_I", "cra:anx_VII", "cra:anx_II"]
answer = """Non, pas à la publier. Le fabricant doit établir une nomenclature des logiciels (SBOM) dans un
format couramment utilisé et lisible par machine, couvrant au moins les dépendances de niveau
supérieur (annexe I, partie II, point 1). Elle fait partie de la documentation technique et doit être
fournie à une autorité de surveillance du marché sur demande motivée (annexe VII). La rendre
accessible aux utilisateurs est un choix du fabricant ; s'il le fait, la notice indique où la
consulter (annexe II, point 9)."""
tags = ["SBOM", "gestion des vulnérabilités"]
notes = "Idée reçue fréquente : la SBOM devrait être publique."

[[questions]]
id = "q038"
lang = "en"
type = "out_of_scope"
question = "Under NIS2, how quickly must an essential entity notify a significant incident to its CSIRT?"
